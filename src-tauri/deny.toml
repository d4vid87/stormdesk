# cargo-deny configuration. Only the advisories check runs in CI (see .github/workflows/audit.yml) —
# licences, bans and sources are not policed yet, and turning them on needs an allowlist for a
# ~700-crate tree rather than a one-line change here.
#
# Every entry below is written up in ../SECURITY.md. Adding one without the writeup defeats the
# point: the file exists so an accepted advisory has a reason attached, not so the check goes quiet.

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; build-time proc-macro helper deep in the Tauri tree, no runtime code." },
  # Tauri's current stable notification/single-instance plugins still use zbus 5.
  # These are maintenance notices, not reported vulnerabilities; see SECURITY.md.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; stable Tauri plugins require zbus 5. Remove when the upstream plugins migrate." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; same stable Tauri dependency constraint as RUSTSEC-2026-0370." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; same stable Tauri dependency constraint as RUSTSEC-2026-0370." },
]
