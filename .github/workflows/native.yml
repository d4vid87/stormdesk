name: native-cpp
on:
  pull_request:
  push:
    branches: [main, cpp-rework]
    paths: ['cpp/**', 'site/**', 'CMakeLists.txt', 'scripts/build-appimage.sh', 'scripts/AppImage.Dockerfile', 'scripts/native-signing.py', 'scripts/test-native-signing.py', '.github/workflows/native.yml', 'app-icon.png', 'LICENSE']
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      require_signing:
        description: Refuse unsigned Windows and macOS packages
        type: boolean
        default: false
concurrency:
  group: native-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ qt6-base-dev qt6-webengine-dev libqt6sql6-sqlite libmosquitto-dev mosquitto mosquitto-clients qt6-wayland libfuse2t64 patchelf desktop-file-utils
      - run: python3 scripts/test-native-signing.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - if: always()
        shell: bash
        run: cat build/native-core-results.txt build/native-ui-results.txt
      - run: python3 cpp/integration_smoke.py build/stormdesk
      - run: cmake -S . -B build-headless -DSTORMDESK_GUI=OFF -DBUILD_TESTING=OFF && cmake --build build-headless --parallel 2
      - run: ./build-headless/stormdesk --version
      - name: Package native Linux builds
        run: |
          arch=$(dpkg --print-architecture)
          mkdir -p release-assets
          cpack --config build/CPackConfig.cmake -B release-assets \
            -D CPACK_PACKAGE_FILE_NAME="StormDesk_5.0.0-preview.3_$arch" \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="$arch"
          bash scripts/build-appimage.sh "$PWD/build" "$PWD/release-assets"
          tar -czf "release-assets/StormDesk_5.0.0-preview.3_collector_$arch.tar.gz" -C build-headless stormdesk
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runner }}
          path: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.tar.gz
  desktop:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - run: python3 scripts/test-native-signing.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - if: runner.os == 'macOS'
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:5 -R stormdesk_ui
      - if: always()
        shell: bash
        run: cat build/native-core-results.txt build/native-ui-results.txt
      - if: failure() && runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: lldb --batch -o run -o 'thread backtrace all' -- build/stormdesk_ui_tests -nocrashhandler
      - if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -maxdepth 1 -name 'stormdesk_ui_tests*' -type f -print -exec cat {} \;
      - name: Sign Windows application
        if: runner.os == 'Windows'
        env:
          REQUIRE_NATIVE_SIGNING: ${{ inputs.require_signing || false }}
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/native-signing.py windows build/Release/stormdesk.exe
      - run: cmake --install build --config Release --prefix dist
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B release-assets -D CPACK_PACKAGE_FILE_NAME=StormDesk_5.0.0-preview.3_windows_x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          if (-not (Test-Path dist/bin/vcruntime140.dll)) { throw 'MSVC runtime was not deployed' }
          python -c "import subprocess; subprocess.run(['dist/bin/stormdesk.exe', '--version'], check=True, timeout=30)"
      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          REQUIRE_NATIVE_SIGNING: ${{ inputs.require_signing || false }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 scripts/native-signing.py macos dist/stormdesk.app --dmg "release-assets/StormDesk_5.0.0-preview.3_macos_$(uname -m).dmg"
          ./dist/stormdesk.app/Contents/MacOS/stormdesk --version
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.runner }}
          path: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.dmg
            native-signing-status.json
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: android
          arch: android_arm64_v8a
          modules: 'qtwebview'
          cache: true
      - uses: actions/checkout@v4
        with:
          repository: KDAB/android_openssl
          ref: b71f1470962019bd89534a2919f5925f93bc5779
          path: android-openssl
          persist-credentials: false
      - name: Configure native Android app
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            -DSTORMDESK_ANDROID_OPENSSL_DIR="$GITHUB_WORKSPACE/android-openssl"
      - run: cmake --build build-android --target apk --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64-build
          path: build-android/android-build/build/outputs/apk/**/*.apk
      - name: Sign distributable Android APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/stormdesk-upload.jks"
          apk=$(find build-android/android-build/build/outputs/apk -name '*.apk' -type f | head -1)
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/stormdesk-upload.jks" --ks-key-alias upload --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out release-assets/StormDesk_5.0.0-preview.3_android_arm64.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release-assets/StormDesk_5.0.0-preview.3_android_arm64.apk
          rm "$RUNNER_TEMP/stormdesk-upload.jks"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: native-android-signed
          path: release-assets/*.apk
