name: native-containers
on:
  push:
    branches: [cpp-rework]
    paths: ['cpp/**', 'site/**', 'CMakeLists.txt', 'Dockerfile', '.github/workflows/native-containers.yml', 'LICENSE']
  workflow_dispatch:
concurrency:
  group: native-containers-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:5.0.0-preview.3-${{ matrix.arch }}
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}
      - name: Check and publish the native collector
        run: |
          docker run --rm --entrypoint /usr/local/bin/stormdesk ghcr.io/${{ github.repository }}:5.0.0-preview.3-${{ matrix.arch }} --version
          docker push ghcr.io/${{ github.repository }}:5.0.0-preview.3-${{ matrix.arch }}
  manifest:
    needs: build
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture preview tag
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository }}:5.0.0-preview.3 \
            ghcr.io/${{ github.repository }}:5.0.0-preview.3-amd64 \
            ghcr.io/${{ github.repository }}:5.0.0-preview.3-arm64
