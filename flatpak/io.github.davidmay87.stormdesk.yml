# Native Qt build; the workflow pins this rolling preview to its exact source revision.
app-id: io.github.davidmay87.stormdesk
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: stormdesk
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
modules:
  - name: stormdesk
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    post-install:
      - install -Dm644 app-icon.png /app/share/icons/hicolor/512x512/apps/io.github.davidmay87.stormdesk.png
      - install -Dm644 flatpak/io.github.davidmay87.stormdesk.desktop /app/share/applications/io.github.davidmay87.stormdesk.desktop
      - install -Dm644 flatpak/io.github.davidmay87.stormdesk.metainfo.xml /app/share/metainfo/io.github.davidmay87.stormdesk.metainfo.xml
      - rm /app/share/applications/stormdesk.desktop
    sources:
      - type: git
        url: https://github.com/d4vid87/stormdesk.git
        branch: cpp-rework
